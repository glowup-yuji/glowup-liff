function lineChart(pts,key,unit,label){
  pts=(pts||[]).filter(function(e){return e[key]!==''&&e[key]!=null&&isFinite(Number(e[key]));}).slice().sort(function(a,b){return String(a.date)<String(b.date)?-1:1;});
  if(pts.length<2)return '';
  var vs=pts.map(function(e){return Number(e[key]);}),min=Math.min.apply(null,vs),max=Math.max.apply(null,vs);
  if(min===max){min-=1;max+=1;}
  var W=320,H=120,p=14,L=38;
  function sx(i){return L+i*(W-L-p)/(pts.length-1);}
  function sy(v){return p+(max-v)/(max-min)*(H-p*2);}
  var d=pts.map(function(e,i){return (i?'L':'M')+sx(i).toFixed(1)+','+sy(Number(e[key])).toFixed(1);}).join(' ');
  var h='<div class="muted">'+label+'</div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">';
  h+='<line x1="'+L+'" y1="'+(H-p)+'" x2="'+(W-p)+'" y2="'+(H-p)+'" stroke="#e6dfd0"/>';
  h+='<text x="2" y="'+(p+4)+'" font-size="10" fill="#6b655b">'+max+unit+'</text><text x="2" y="'+(H-p+3)+'" font-size="10" fill="#6b655b">'+min+unit+'</text>';
  h+='<text x="'+L+'" y="'+(H-1)+'" font-size="10" fill="#6b655b">'+esc(fmtDate(pts[0].date))+'</text><text x="'+(W-p)+'" y="'+(H-1)+'" font-size="10" fill="#6b655b" text-anchor="end">'+esc(fmtDate(pts[pts.length-1].date))+'</text>';
  h+='<path d="'+d+'" fill="none" stroke="#b08d2e" stroke-width="2"/>';
  pts.forEach(function(e,i){h+='<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(Number(e[key])).toFixed(1)+'" r="3" fill="#b08d2e"/>';});
  return h+'</svg>';
}

  if(!s.length) return '<div class="hv-hero"><div class="k">いまの体重</div><div style="color:#cbb98a;margin-top:8px;font-size:13px">体重の記録がまだありません。</div></div>';
  var a=s[0],b=s[s.length-1],ch=s.length>1?Number(b.weight)-Number(a.weight):null,fat=hvNum(b.fat),goal=hvNum(H.goal);
  var h='<div class="hv-hero"><div class="k">いまの体重</div><div class="now"><div class="kg">'+esc(b.weight)+'</div><div class="unit">kg</div>';
  if(fat!=null)h+='<div class="fat">体脂肪率<b>'+fat+'%</b></div>';
  h+='</div><div class="hv-chg">';
  h+='<div><div class="l">開始（'+esc(hvMD(a.date))+'）</div><div class="v">'+esc(a.weight)+'</div><div class="s">kg</div></div>';
  h+='<div><div class="l">開始から</div><div class="v'+(ch!=null&&ch<0?' good':(ch>0?' bad':''))+'">'+(ch!=null?hvSign(ch):'—')+'</div><div class="s">kg</div></div>';
  if(goal!=null){
    var remain=hvR1(Number(b.weight)-goal);
    h+='<div><div class="l">目標まで</div><div class="v'+(remain<=0?' good':'')+'">'+(remain<=0?'達成':remain)+'</div><div class="s">kg</div></div>';
  }else h+='<div><div class="l">目標まで</div><div class="v">—</div><div class="s">目標未設定</div></div>';
  return h+'</div></div>';
}
function hvRecent7(H){
  var r=H.recent7;if(!r)return '';
  var h='<div class="card hv-fastsum"><h2>'+esc(r.title||'直近7日')+'</h2>';
  h+='<div class="hv-fastrow">';
  h+='<div class="box"><div class="l">ファスティング平均</div><div class="v">'+(r.fastAvgLabel?esc(r.fastAvgLabel):'—')+'</div></div>';
  h+='<div class="box'+(r.days16?' ok':'')+'"><div class="l">'+(r.goalH||16)+'時間以上</div><div class="v">'+(r.known?r.days16+'日<span class="s"> / '+r.daysTotal+'日</span>':'—')+'</div></div>';
  h+='</div>';
  h+='<div class="hv-mealrow"><div class="meal-big"><div class="l">食事の回数</div><div class="v">'+r.mealTotal+'<span class="u">回</span></div></div>';
  h+='<div class="meal-br"><div>食事 <b>'+r.mealMain+'</b>回<span class="sub">（朝・昼・夕）</span></div><div>間食 <b>'+r.mealSnack+'</b>回</div><div class="avg">1日平均 <b>'+r.mealAvg+'</b>回</div></div></div>';
  if(r.dots&&r.dots.length){
    h+='<div class="hv-dots" aria-label="直近7日。緑は16時間以上。数字は食事と間食の合計回数">';
    r.dots.forEach(function(d){h+='<span class="'+(d.on?'on':'')+'"><i></i>'+esc(d.w)+'<div class="n">'+d.n+'</div></span>';});
    h+='</div>';
  }
  return h+'</div>';
}
function hvRecent7Boxes(H){
  var r=H.recent7;if(!r)return '';
  var ch=r.wChange,chTxt=ch==null?'—':hvSign(ch)+'kg';
  var chSub=(r.wFirst!=null&&r.wLast!=null)?(r.wFirst+' → '+r.wLast):'';
  var h='<div class="hv-sec" id="weeks">直近7日のまとめ'+(r.rangeLabel?'（'+esc(r.rangeLabel)+'）':'')+'</div>';
  h+='<div class="hv-week">';
  h+='<div class="box"><div class="l">体重の変化</div><div class="v'+(ch!=null&&ch<0?' good':(ch>0?' bad':''))+'">'+chTxt+'</div><div class="s">'+esc(chSub)+'</div></div>';
  h+='<div class="box"><div class="l">いちばん長い</div><div class="v'+(r.longestLabel?' good':'')+'">'+(r.longestLabel?esc(r.longestLabel):'—')+'</div><div class="s">'+esc(r.longestDate||'')+'</div></div>';
  h+='<div class="box"><div class="l">食事</div><div class="v">'+r.mealMain+'<span style="font-size:13px;font-weight:700">回</span></div><div class="s">間食 '+r.mealSnack+'回</div></div>';
  h+='<div class="box"><div class="l">'+(r.goalH||16)+'時間以上</div><div class="v'+(r.days16?' good':'')+'">'+(r.known?r.days16+'<span style="font-size:13px;font-weight:700">日</span>':'—')+'</div><div class="s">'+(r.fastAvgLabel?'平均 '+esc(r.fastAvgLabel):'')+'</div></div>';
  return h+'</div>';
}
function hvImgErr(el){el.outerHTML='<div class="hv-ph">写真なし</div>';}
function hvThumb(p){
  if(!p||!p.thumb)return '';
  var img='<img src="'+esc(p.thumb)+'" alt="'+esc(p.note||'食事写真')+'" onerror="hvImgErr(this)">';
  var href=p.view||p.url||'';
  return href?'<a href="'+esc(href)+'" target="_blank" rel="noopener">'+img+'</a>':img;
}
function hvSlot(name,sl){
  sl=sl||{s:'',t:'',photos:[],fromLine:false,times:[]};
  var h='<div class="hv-slot"><div class="n">'+esc(name)+'</div>';
  if(name==='間食'){
    var times=(sl.times||[]).filter(function(t){return t;});
    var n=(sl.times||[]).length;
    if(!n)h+='<div class="t off">なし</div><div class="hv-ph">—</div>';
    else{
      h+='<div class="t">'+(times[0]?esc(times[0]):(n+'回'))+'</div>';
      var ph=(sl.photos||[]).filter(function(p){return p.thumb;})[0];
      if(ph)h+=hvThumb(ph);
      else h+='<div class="hv-ph">'+(n===1?'1回':n+'回')+'</div>';
      var cap=sl.photos&&sl.photos[0]&&sl.photos[0].note?sl.photos[0].note:'';
      if(times.length>1)cap=(cap?cap+'・':'')+times.join(' / ');
      if(cap||sl.fromLine)h+='<div class="cap">'+esc(cap)+(sl.fromLine?'<span class="from">LINE</span>':'')+'</div>';
    }
  }else if(sl.s==='no'){
    h+='<div class="t off">なし</div><div class="hv-ph">—</div>';
  }else if(sl.s==='yes'){
    h+='<div class="t">'+(sl.t?esc(sl.t):'食べた')+'</div>';
    var thumbs=(sl.photos||[]).filter(function(p){return p.thumb;});
    if(thumbs[0])h+=hvThumb(thumbs[0]);
    else h+='<div class="hv-ph">写真なし</div>';
    var cap=sl.note||(sl.photos&&sl.photos[0]&&sl.photos[0].note)||'';
    if(cap||sl.fromLine||thumbs.length>1)h+='<div class="cap">'+esc(cap)+(thumbs.length>1?' ・他'+(thumbs.length-1)+'枚':'')+(sl.fromLine?'<span class="from">LINE</span>':'')+'</div>';
  }else{
    h+='<div class="t off">—</div><div class="hv-ph">—</div>';
  }
  return h+'</div>';
}
function hvChart(pts,key,label,unit,goal){
  pts=pts.filter(function(e){return hvNum(e[key])!=null;});
  if(pts.length<2)return '<div class="hv-nochart muted">'+esc(label)+'：グラフは、2日分の記録がたまると出ます。</div>';
  var vs=pts.map(function(e){return Number(e[key]);});
  var min=Math.min.apply(null,vs),max=Math.max.apply(null,vs);
  var g=hvNum(goal);
  if(g!=null){min=Math.min(min,g);max=Math.max(max,g);}
  var pad=Math.max((max-min)*0.15,key==='weight'?0.5:0.3);min=hvR1(min-pad);max=hvR1(max+pad);
  if(max<=min)max=min+1;
  var W=340,H=154,T=16,B=26,L=44,R=12;
  var t0=new Date(pts[0].date.replace(/-/g,'/')).getTime(),t1=new Date(pts[pts.length-1].date.replace(/-/g,'/')).getTime();
  function sx(e){var t=new Date(e.date.replace(/-/g,'/')).getTime();return L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R);}
  function sy(v){return T+(max-v)/(max-min)*(H-T-B);}
  var h='<svg class="hv-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'の推移">';
  for(var i=0;i<4;i++){var v=hvR1(max-(max-min)*i/3),y=sy(v).toFixed(1);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#ece5d3"/><text x="'+(L-6)+'" y="'+(+y+3.5)+'" font-size="11" fill="#6b655b" text-anchor="end">'+v+'</text>';}
  if(g!=null){var gy=sy(g).toFixed(1);h+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#1f7a3f" stroke-dasharray="5 4" stroke-width="1.6"/><text x="'+(W-R)+'" y="'+(gy-4)+'" font-size="11" font-weight="700" fill="#1f7a3f" text-anchor="end">目標 '+g+unit+'</text>';}
  var d=pts.map(function(e,i){return (i?'L':'M')+sx(e).toFixed(1)+','+sy(Number(e[key])).toFixed(1);}).join(' ');
  var area=d+' L'+sx(pts[pts.length-1]).toFixed(1)+','+(H-B)+' L'+sx(pts[0]).toFixed(1)+','+(H-B)+' Z';
  h+='<path d="'+area+'" fill="#b08d2e" fill-opacity=".10"/><path d="'+d+'" fill="none" stroke="#b08d2e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
  if(pts.length<=45)pts.forEach(function(e,i){if(i===0||i===pts.length-1)return;h+='<circle cx="'+sx(e).toFixed(1)+'" cy="'+sy(Number(e[key])).toFixed(1)+'" r="2.6" fill="#b08d2e"/>';});
  var first=pts[0];h+='<circle cx="'+sx(first).toFixed(1)+'" cy="'+sy(Number(first[key])).toFixed(1)+'" r="3.4" fill="#b08d2e"/>';
  var le=pts[pts.length-1],lx=sx(le),ly=sy(Number(le[key]));
  h+='<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5.5" fill="#0b0a08" stroke="#d4af37" stroke-width="2.2"/>';
  h+='<text x="'+Math.min(lx,W-R).toFixed(1)+'" y="'+Math.max(ly-10,T+8).toFixed(1)+'" font-size="13" font-weight="800" fill="#0b0a08" stroke="#fff" stroke-width="4" paint-order="stroke" text-anchor="end">'+le[key]+unit+'</text>';
  var mid=pts[Math.floor((pts.length-1)/2)];
  h+='<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="#6b655b">'+esc(hvMD(pts[0].date))+'</text>';
  if(pts.length>2)h+='<text x="'+sx(mid).toFixed(1)+'" y="'+(H-8)+'" font-size="11" fill="#6b655b" text-anchor="middle">'+esc(hvMD(mid.date))+'</text>';
  h+='<text x="'+(W-R)+'" y="'+(H-8)+'" font-size="11" fill="#6b655b" text-anchor="end">'+esc(hvMD(le.date))+'</text>';
  return h+'</svg>';
}
function hvStat(title,val,sub,cls){return '<div class="hv-st'+(cls?' '+cls:'')+'"><div class="muted">'+title+'</div><div class="hv-big">'+val+'</div><div class="muted">'+sub+'</div></div>';}
function hvRangeStats(pts,key,unit){
  pts=pts.filter(function(e){return hvNum(e[key])!=null;});
  if(!pts.length)return '';
  var a=pts[0],b=pts[pts.length-1],ch=pts.length>1?Number(b[key])-Number(a[key]):null;
  return '<div class="hv-stats">'+hvStat('はじめ（'+esc(hvMD(a.date))+'）',a[key],unit)+hvStat('いま（'+esc(hvMD(b.date))+'）',b[key],unit)+hvStat('変化',hvSign(ch),unit,ch!=null&&ch<0?'down':(ch>0?'up':''))+'</div>';
}
function hvWeeks(H){
  var ws=H.weeks||[];if(!ws.length)return '';
  var h='<div class="hv-sec">週ごとのまとめ</div><div class="card hv-list">';
  ws.slice(0,HV.wn).forEach(function(w){
    h+='<div class="hv-wk"><div class="hv-dh"><b>'+esc(w.label)+'</b>'+(w.isNow?' <span class="tag">今週</span>':'')+'<span class="hv-wchg'+(w.wChange!=null&&w.wChange<0?' down':(w.wChange>0?' up':''))+'">'+(w.wChange!=null?'体重 '+hvSign(w.wChange)+'kg':(w.wLast!=null?'体重 '+w.wLast+'kg':''))+'</span></div>';
    h+='<div class="hv-wg"><div><span class="muted">食事</span><b>'+w.count+'</b>回'+(w.snack?'<span class="muted">（間食'+w.snack+'）</span>':'')+'</div>';
    h+='<div><span class="muted">平均</span><b>'+(w.avg!=null?hvR1(w.avg):'—')+'</b>時間</div>';
    h+='<div><span class="muted">合計</span><b>'+(w.total!=null?hvR1(w.total):'—')+'</b>時間</div>';
    h+='<div><span class="muted">'+(H.goalH||16)+'h以上</span><b>'+w.days16+'</b>日</div></div>';
    h+='<div class="muted">記録 '+w.recDays+'日'+(w.max!=null?'・いちばん長い '+hvR1(w.max)+'時間':'')+'</div></div>';
  });
  h+='</div>';
  if(ws.length>HV.wn)h+='<button class="ghost hv-more" onclick="hvMoreW()">もっと前の週を見る（あと'+(ws.length-HV.wn)+'週）</button>';
  return h;
}
function hvDays(H){
  var ds=H.days||[];if(!ds.length)return '<div class="card muted">まだ記録がありません。</div>';
  var h='<div class="card hv-daysheet" id="days">';
  ds.slice(0,HV.n).forEach(function(x){
    var sl=x.slots||{};
    h+='<div class="hv-day'+(x.isToday?' today':'')+'">';
    h+='<div class="hv-dh"><div><div class="date">'+esc(x.label||hvMD(x.date))+(x.isToday?'<span class="hv-pill now">きょう</span>':'')+'</div></div>';
    h+='<div class="wnow">'+(x.weight!==''?'<b>'+x.weight+'</b><span>kg</span>':'<span class="muted">体重 —</span>')+(x.fat!==''?'<span class="fatn">体脂肪 '+x.fat+'%</span>':'')+'</div></div>';
    if(x.fastLabel){
      h+='<div class="hv-fastbar'+(x.fastMins!=null&&x.fastMins>=(H.goalH||16)*60?' good':'')+'"><div class="ft">ファスティング <b>'+esc(x.fastLabel)+'</b></div>';
      h+='<div class="fr">'+esc(x.fastFromLabel||'')+(x.fastTo?' → '+esc(x.fastTo):'')+'</div></div>';
    }else if(x.rec||(x.mealTotal)){
      h+='<div class="hv-fastbar miss"><div class="ft">ファスティング —</div><div class="fr">時間の記録がそろった日だけ出ます</div></div>';
    }
    if(x.slots||x.rec){
      h+='<div class="hv-meals4">'+hvSlot('朝',sl['朝']||(x.rec&&{s:x.rec.b&&x.rec.b.s,t:x.rec.b&&x.rec.b.t}))+hvSlot('昼',sl['昼']||(x.rec&&{s:x.rec.l&&x.rec.l.s,t:x.rec.l&&x.rec.l.t}))+hvSlot('夕',sl['夕']||(x.rec&&{s:x.rec.d&&x.rec.d.s,t:x.rec.d&&x.rec.d.t}))+hvSlot('間食',sl['間食']||(x.rec&&{times:x.rec.snacks||[]}))+'</div>';
    }else h+='<div class="muted" style="margin-top:6px">食事の記録なし</div>';
    if(x.rec&&x.rec.note)h+='<div class="hv-dnote">'+esc(x.rec.note)+'</div>';
    if(x.wnote)h+='<div class="hv-dnote">体重メモ：'+esc(x.wnote)+'</div>';
    h+='</div>';
  });
  h+='</div>';
  if(ds.length>HV.n)h+='<button class="ghost hv-more" onclick="hvMore()">もっと見る（あと'+(ds.length-HV.n)+'日）</button>';
  return h;
}
function histView(H){
  var h='<div class="hv">'+hvHero(H)+hvRecent7(H);
  var pts=hvInRange(H);
  h+='<div class="card" id="chart"><div class="hv-charthead"><h2>体重の流れ</h2><div class="hv-seg mini">';
  [['1m','1ヶ月'],['3m','3ヶ月'],['all','全期間']].forEach(function(r){h+='<button class="'+(HV.range===r[0]?'on':'')+'" onclick="hvSetRange(\''+r[0]+'\')">'+r[1]+'</button>';});
  h+='</div></div>';
  if(!(H.series||[]).length)h+='<div class="muted">体重の記録がまだありません。記録すると、ここに流れが出ます。</div>';
  else if(!pts.length)h+='<div class="muted">この期間の体重の記録はありません。「全期間」で見てみてください。</div>';
  else h+=hvChart(pts,'weight','体重（kg）','kg',H.goal);
  h+='</div>';
  h+=hvRecent7Boxes(H);
  if(pts.some(function(e){return hvNum(e.fat)!=null;}))h+='<div class="card"><div class="hv-h">体脂肪率</div>'+hvChart(pts,'fat','体脂肪率（%）','%','')+'</div>';
  h+='<div class="hv-sec" id="days-h">日ごとの記録</div>'+hvDays(H);
  h+=hvWeeks(H);
  h+='<p class="muted hv-note">ファスティング時間は、前の日の最後の食事（間食をふくむ）から、その日の最初に食べたときまでです。前日の記録がないときや、食べたのに時間が入っていないときは表示されません。朝を飛ばして昼から食べた日は、その分長くなります。写真の「LINE」は、公式LINEから送られた記録です。</p>';
  return h+'</div>';
}
var HIST=null,histLoading=false,histErr='';
function loadHist(){histLoading=true;histErr='';gas().withSuccessHandler(function(r){histLoading=false;HIST=r;if(tab==='履歴')render();}).withFailureHandler(function(e){histLoading=false;histErr=(e&&e.message)||String(e);if(tab==='履歴')render();}).api_history(TOKEN);}
function retryHist(){histErr='';render();}
function viewHist(){
  if(!HIST){
    if(histErr)return '<div class="card err">'+esc(histErr)+'</div><button class="ghost hv-more" onclick="retryHist()">もう一度読み込む</button>';
    if(!histLoading)loadHist();
    return '<div class="card muted">これまでの記録を読み込んでいます…</div>';
  }
  return histView(HIST);
}
function alertMsg(m,cls){document.getElementById('flash').innerHTML='<div class="card '+(cls||'ok')+'">'+esc(m)+'</div>';window.scrollTo(0,0);}
/* ---------- 公式LINEから開いたとき ---------- */
function getParam(name){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get(name))return q.get(name);
    var state=q.get('liff.state')||'';
    if(!state)return '';
    var s=state;try{s=decodeURIComponent(state);}catch(e){}
    var i=s.indexOf('?');
    var q2=new URLSearchParams(i>=0?s.slice(i+1):s);
    return q2.get(name)||'';
  }catch(e){return '';}
}
function getU(){return getParam('u');}
function showUnlinked(formUrl){
  var f=/^https:\/\//.test(String(formUrl||''))?formUrl:FORM_URL_DEFAULT;
  document.getElementById('flash').innerHTML='';
  document.getElementById('app').innerHTML='<div style="text-align:center;padding:12px 4px">'
    +'<p>まだ、このLINEとお客様情報の連携ができていません。</p>'
    +'<p>うーじさんから公式LINEで届いた専用リンクを、このLINEの中で1回開いてください。それ以降は、トーク画面の「予約」や「マイページ」から使えるようになります。</p>'
    +'<p style="margin-top:28px">まだ入会前の方は、こちらからお申し込みください。</p>'
    +'<p><a href="'+esc(f)+'" target="_blank" style="display:inline-block;background:#0b0a08;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700">入会の申し込みへ</a></p>'
    +'</div>';
}
function startLine(){
  if(!window.liff){fail({message:OPEN_ERR});return;}
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    var idt=liff.getIDToken();
    if(!idt){fail({message:'LINEの確認ができませんでした。許可の画面で同意してから、もう一度開いてください。'});return;}
    var u=getU(), tb=getParam('tab');
    call('line',{id_token:idt,u:u,tab:tb}).then(function(r){
      if((u||tb)&&window.history&&history.replaceState){try{history.replaceState(null,'',location.pathname);}catch(e){}}
      r=r||{};
      if(r.status==='ok'){TOKEN=r.token||'';NOTICE=r.notice||'';START=r.start||'';onMe(r.me);return;}
      if(r.status==='enroll'){TOKEN='';TICKET=r.ticket||'';START=r.start||'申込み';load();return;}
      showUnlinked(r.formUrl);
    },fail);
  }).catch(function(){fail({message:OPEN_ERR});});
}
startLine();
