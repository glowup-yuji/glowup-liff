<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLOW UP. ご予約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--gold:#b08d2e;--ink:#1d1b18;--muted:#6b655b;--line:#e6dfd0;--bg:#faf8f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
header{background:#0b0a08;color:#d4af37;text-align:center;padding:14px;font-family:Georgia,serif;letter-spacing:.2em;font-size:20px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}h2{font-size:15px;margin:22px 0 8px;color:var(--gold);letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:28px;font-weight:700}.muted{color:var(--muted);font-size:13px}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.pri{background:#0b0a08;color:#fff;width:100%;padding:14px;font-weight:700}.ghost{background:#fff;border:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.days button{flex:none;background:#fff;border:1px solid var(--line)}
.days button.on,.times button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.times button{background:#fff;border:1px solid var(--line);padding:10px 0}
.confirm{margin-top:12px}.err{color:#b3261e}.ok{color:#1f7a3f}
.note{font-size:12.5px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
.tabs{display:flex;gap:6px;margin:0 0 16px}
.tabs button{flex:1;background:#fff;border:1px solid var(--line);padding:10px 6px;font-weight:600;font-size:14px}
.tabs button.on{background:#0b0a08;color:#fff}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.trend .card{text-align:center;margin:0;padding:12px 8px}
.trend .big{font-size:22px}
.hist{font-size:13.5px}
.hist .row{padding:8px 0;border-bottom:1px solid var(--line)}
.hist .row:last-child{border-bottom:0}
.tabs button{white-space:nowrap;font-size:13px;padding:10px 4px}
.ref{background:#f6eedb;border-color:#eadcb6}
.ref .muted{margin-top:4px}
.pre{white-space:pre-wrap}
.plan{cursor:pointer;position:relative}.plan.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:#fffdf6}
.plan .price{font-weight:700;font-size:17px;white-space:nowrap}.plan .pdesc{color:var(--muted);font-size:13px;margin-top:4px}
.plan .pick{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);vertical-align:-3px;margin-right:6px}.plan.on .pick{border:6px solid var(--gold)}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:8px 0}.chk input{width:auto;margin-top:5px;flex:none}
.kv{display:grid;grid-template-columns:7em 1fr;gap:6px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.req{color:#b3261e;font-size:11px;margin-left:4px}
.terms{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.linkbtn{display:block;text-align:center;text-decoration:none;border-radius:10px;margin-top:10px}
</style></head><body><header>GLOW UP.</header><div id="flash" style="max-width:560px;margin:0 auto;padding:12px 16px 0"></div><main id="app"><p class="muted">読み込み中…</p></main>
<script>
/* GLOW UP. マイページ（公式LINE / LIFF）  ※予約システム v7 と組み合わせて使います
   LINEで本人確認 → 予約システム（Google Apps Script）の JSON API を fetch で呼びます。
   この画面から script.google.com へ移動することはありません。管理キーはここにはありません。 */
var LIFF_ID = '2012605802-7XWt8wqw';
var API_URL = 'https://script.google.com/macros/s/AKfycbytwXgcklFUqBaWNb2P67plc8RXNIUmHkgx6Ckzao75rlsbQpm8i9BlVioV43IEg3lM/exec';
var FORM_URL_DEFAULT = 'https://docs.google.com/forms/d/e/1FAIpQLSdlOM8HhH2OuScbH5d3edMAzbWaB23CGSuBUIRZS7gtHfuXWQ/viewform';
var OPEN_ERR = '画面を開けませんでした。時間をおいて、もう一度「予約・体重」から開いてください。';
var NET_ERR = '通信がうまくいきませんでした。電波のよいところで、もう一度お試しください。';
var TOKEN = '';
var NOTICE = '';
var TICKET = '';
var START = '';
function call(action, params){
  var body = {action: action};
  if (params) for (var k in params) if (Object.prototype.hasOwnProperty.call(params, k)) body[k] = params[k];
  return fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit', cache: 'no-store'})
    .then(function(res){ if (!res.ok) throw new Error(NET_ERR); return res.text(); }, function(){ throw new Error(NET_ERR); })
    .then(function(t){ var r; try { r = JSON.parse(t); } catch (e) { throw new Error(NET_ERR); } if (!r || !r.ok) throw new Error((r && r.error) || NET_ERR); return r.data; });
}
/* 以前の gas() と同じ書き方で、サーバーを呼べるようにする小さな仕組み */
var API_ARGS = {
  api_me: ['me', ['token']],
  api_book: ['book', ['token', 'ms']],
  api_cancel: ['cancel', ['token', 'bookingId']],
  api_saveGoal: ['saveGoal', ['token', 'f']],
  api_saveWeight: ['saveWeight', ['token', 'f']],
  api_getMonthly: ['getMonthly', ['token']],
  api_saveMonthly: ['saveMonthly', ['token', 'f']],
  api_enrollInfo: ['enrollInfo', ['token', 'ticket']],
  api_enroll: ['enroll', ['token', 'ticket', 'f']]
};
function gas(){
  var ok = function(){}, ng = function(){};
  var r = {
    withSuccessHandler: function(f){ ok = f; return r; },
    withFailureHandler: function(f){ ng = f; return r; }
  };
  Object.keys(API_ARGS).forEach(function(name){
    r[name] = function(){
      var spec = API_ARGS[name], p = {};
      for (var i = 0; i < spec[1].length; i++) p[spec[1][i]] = arguments[i];
      call(spec[0], p).then(function(d){ ok(d); }, function(e){ ng(e); });
    };
  });
  return r;
}
var E = null, ES = {step:'form', f:{}}, eLoading = false;
var D = null, day = null, pick = null, tab = '予約', wDate = null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function onMe(d){D=d;if(!wDate)wDate=d.today;if(START){tab=START;START='';}if(NOTICE){document.getElementById('flash').innerHTML='<div class="card ok" style="margin:0">'+esc(NOTICE)+'</div>';NOTICE='';}render();}
function load(){if(!TOKEN){tab='申込み';render();return;}gas().withSuccessHandler(onMe).withFailureHandler(fail).api_me(TOKEN);}
function fail(e){document.getElementById('app').innerHTML='<div class="card err">'+esc(e.message||e)+'</div>';}
function go(t){tab=t;render();}
function tabs(){
  var items=[['予約','予約'],['目標','目標'],['今月','今月の目標'],['体重','今日の体重']];
  var h='<div class="tabs">';
  items.forEach(function(it){h+='<button class="'+(tab===it[0]?'on':'')+'" onclick="go(\''+it[0]+'\')">'+it[1]+'</button>';});
  return h+'</div>';
}
function render(){
  if(!TOKEN){document.getElementById('app').innerHTML='<h1>入会のお申し込み</h1>'+viewEnroll();return;}
  var h='<h1>'+esc(D.name)+' 様</h1>'+tabs();
  if(tab==='申込み') h+='<p><button class="ghost" onclick="backHome()">← マイページにもどる</button></p>'+viewEnroll();
  else if(tab==='目標') h+=viewGoal();
  else if(tab==='体重') h+=viewWeight();
  else if(tab==='今月') h+=viewMonthly();
  else h+=viewBook();
  document.getElementById('app').innerHTML=h;
}
function viewBook(){
  var h='<h2>ご契約中のプラン</h2>';
  if(!D.contracts.length) h+='<div class="card muted">ご契約中のプランはありません。</div>';
  D.contracts.forEach(function(k){
    if(k.paid==='申込み中'){h+='<div class="card ref"><div class="row"><b>'+esc(k.plan)+'</b><span class="muted">お申し込み受付中</span></div><div class="muted">うーじさんから公式LINEでご連絡します。開始日はそのときに決めます。</div></div>';return;}
    h+='<div class="card"><div class="row"><b>'+esc(k.plan)+'</b></div><div class="muted">'+esc(k.period)+'</div>';
    if(k.total){var p=Math.round(k.used/k.total*100);h+='<div class="row" style="margin-top:6px"><span>残り</span><span><span class="big">'+k.left+'</span> 回 / 全'+k.total+'回</span></div><div class="bar"><i style="width:'+p+'%"></i></div>';}
    h+='</div>';
  });
  h+='<h2>ご予約</h2>';
  if(!D.upcoming.length) h+='<div class="card muted">今のご予約はありません。</div>';
  D.upcoming.forEach(function(b){
    h+='<div class="card row"><div><b>'+esc(b.label)+'</b><div class="muted">'+esc(b.plan)+'</div></div>'+(b.cancelable?'<button class="ghost" onclick="cancelB(\''+b.id+'\',this)">キャンセル</button>':'<span class="muted">前日を過ぎています</span>')+'</div>';
  });
  h+='<h2>予約する</h2><div class="card">';
  if(D.pendingApply&&!D.canBook){
    h+='<p>お申し込みを受け付けました。内容を確認して、こちらから受付確定のご連絡をします。確定までもうしばらくお待ちください。</p><p class="muted" style="margin:0">そのあいだに、「目標」や「今日の体重」タブを使っておくこともできます。</p>';
  }else if(!D.canBook){
    h+='<p>こちらのプランは、食事サポートが中心です。この画面からのご予約はありません。</p><p class="muted" style="margin:0">対面でお会いしたいときは、公式LINEでご相談ください。</p>';
  }else if(!D.slots.length){
    h+='<div class="muted">今予約できる枠がありません。残り回数がない場合や、ご希望の日時がない場合は、公式LINEでご相談ください。</div>';
  }else{
    var days=[];D.slots.forEach(function(s){if(days.indexOf(s.day)<0)days.push(s.day);});
    if(!day||days.indexOf(day)<0)day=days[0];
    h+='<div class="muted" style="margin-bottom:6px">日にちを選んでください</div><div class="days">';
    days.forEach(function(d){h+='<button class="'+(d===day?'on':'')+'" onclick="selDay(\''+d+'\')">'+esc(d)+'</button>';});
    h+='</div><div class="times">';
    D.slots.filter(function(s){return s.day===day;}).forEach(function(s){h+='<button class="'+(pick&&pick.ms===s.ms?'on':'')+'" onclick="selT('+s.ms+')">'+s.time+'</button>';});
    h+='</div>';
    if(pick){h+='<div class="confirm"><p><b>'+esc(pick.day)+' '+pick.time+'</b>（'+D.len+'分）で予約しますか？</p><button class="pri" id="go" onclick="book()">この日時で予約する</button></div>';}
    h+='<div id="msg"></div>';
  }
  h+='</div>';
  if(D.past.length){h+='<h2>これまで</h2>';D.past.forEach(function(b){h+='<div class="card row"><span>'+esc(b.label)+'</span><span class="muted">'+esc(b.state==='予約済'?'完了':b.state)+'</span></div>';});}
  h+='<h2>プランのお申し込み</h2><div class="card"><p class="muted" style="margin-top:0">継続プランへの切り替えや、新しいプランのお申し込みはこちらから。</p><button class="ghost" style="width:100%" onclick="openApply()">プランを申し込む</button></div>';
  if(D.canBook){h+='<div class="note">場所：'+esc(D.place)+'<br>キャンセルは前日までこの画面からできます。当日のキャンセルは1回分の消化になります。<br>日時を変えたいときは、キャンセルしてから取り直してください。</div>';}
  else{h+='<div class="note">場所：'+esc(D.place)+'</div>';}
  return h;
}
/* ---------- 入会・プランのお申し込み ---------- */
var COND = [['program','GLOW UP.の3ヶ月プログラムを修了した'],['pitin','PIT INのサイクルファスティングを3ヶ月受けた'],['none','どちらでもない・相談したい']];
function openApply(){ES={step:'form',f:{}};E=null;tab='申込み';render();window.scrollTo(0,0);}
function backHome(){ES={step:'form',f:{}};E=null;go('予約');window.scrollTo(0,0);}
function toGoal(){ES={step:'form',f:{}};go('目標');window.scrollTo(0,0);}
function loadEnroll(){
  if(eLoading)return;eLoading=true;
  gas().withSuccessHandler(function(r){eLoading=false;E=r;var f=ES.f;if(!f._init){f._init=1;f.name=f.name||r.me.name;f.tel=f.tel||r.me.tel;f.email=f.email||r.me.email;}render();})
  .withFailureHandler(function(e){eLoading=false;fail(e);}).api_enrollInfo(TOKEN,TICKET);
}
function ePlan(){if(!E)return null;return E.plans.filter(function(p){return p.id===ES.f.plan;})[0]||null;}
function condLabel(k){var x=COND.filter(function(c){return c[0]===k;})[0];return x?x[1]:'';}
function kindLabel(k){return k==='オンライン'?'オンライン食事サポート':(k==='パーソナル'?'パーソナルトレーニング（食事サポート付き）':(k==='会員'?'卒業生の方':(k||'その他')));}
function eget(id){var el=document.getElementById(id);return el?el.value:null;}
function collect(){
  var f=ES.f;
  [['e_name','name'],['e_tel','tel'],['e_mail','email'],['e_goal','goal'],['e_health','health'],['e_note','note']].forEach(function(p){var v=eget(p[0]);if(v!==null)f[p[1]]=v;});
  var ag=document.getElementById('e_agree');if(ag)f.agree=ag.checked;
  var cs=document.querySelectorAll('input[name=e_cond]');for(var i=0;i<cs.length;i++){if(cs[i].checked)f.cond=cs[i].value;}
}
function selPlan(el){collect();ES.f.plan=el.getAttribute('data-id');render();}
function selCond(el){collect();}
function viewEnroll(){
  if(ES.step==='done')return viewEnrollDone();
  if(!E){loadEnroll();return '<p class="muted">読み込み中…</p>';}
  if(!E.open)return '<div class="card">現在、こちらからのお申し込みは受け付けていません。公式LINEでご相談ください。</div>';
  if(ES.step==='confirm')return viewEnrollConfirm();
  var f=ES.f, sel=ePlan(), h='';
  h+='<p class="muted">ご希望のプランを選んで、お名前と連絡先を入れてください。この画面でお支払いが発生することはありません。</p>';
  if(E.guest)h+='<div class="card ref" style="font-size:13px">すでにお申し込み済みの方、通っている方は、うーじさんから公式LINEで届いた<b>専用リンク</b>を1回開いてください。LINEと連携され、予約や体重の画面が使えるようになります。</div>';
  if(E.pending&&E.pending.length)h+='<div class="card ref" style="font-size:13px">お申し込み受付中：'+esc(E.pending.join('、'))+'<br>うーじさんからのご連絡をお待ちください。</div>';
  var kinds=[];E.plans.forEach(function(p){if(kinds.indexOf(p.kind)<0)kinds.push(p.kind);});
  if(!E.plans.length)h+='<div class="card muted">今お申し込みできるプランがありません。公式LINEでご相談ください。</div>';
  kinds.forEach(function(k){
    h+='<h2>'+esc(kindLabel(k))+'</h2>';
    E.plans.filter(function(p){return p.kind===k;}).forEach(function(p){
      h+='<div class="card plan'+(f.plan===p.id?' on':'')+'" data-id="'+esc(p.id)+'" onclick="selPlan(this)"><div class="row"><b><span class="pick"></span>'+esc(p.name)+'</b><span class="price">'+esc(p.priceLabel)+'</span></div>';
      if(p.desc)h+='<div class="pdesc">'+esc(p.desc)+'</div>';
      h+='</div>';
    });
  });
  if(sel&&sel.cont){
    h+='<div class="card ref"><b>継続プランについて</b><p class="muted" style="margin:4px 0 8px">継続プランは、ふだんはGLOW UP.の3ヶ月プログラムを終えた方が対象です。PIT INのサイクルファスティングを3ヶ月受けた方は、3ヶ月プログラムなしで継続プランから始められます。</p>';
    COND.forEach(function(c){h+='<label class="chk"><input type="radio" name="e_cond" value="'+c[0]+'"'+(f.cond===c[0]?' checked':'')+' onchange="selCond(this)">'+esc(c[1])+'</label>';});
    h+='</div>';
  }
  h+='<h2>お客様の情報</h2><div class="card">';
  h+='<label>お名前<span class="req">必須</span></label><input id="e_name" autocomplete="name" placeholder="山田 太郎" value="'+esc(f.name||'')+'">';
  h+='<label>電話番号<span class="req">必須</span></label><input id="e_tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="090-1234-5678" value="'+esc(f.tel||'')+'">';
  h+='<label>メールアドレス<span class="req">必須</span></label><input id="e_mail" type="email" inputmode="email" autocomplete="email" placeholder="example@gmail.com" value="'+esc(f.email||'')+'">';
  h+='<label>目標・なりたい姿（任意）</label><textarea id="e_goal" rows="2" placeholder="例：3ヶ月で5kg落としたい、リバウンドしない食べ方を身につけたい">'+esc(f.goal||'')+'</textarea>';
  h+='<label>体の悩み・既往歴（任意）</label><textarea id="e_health" rows="2" placeholder="ケガや持病、通院中のことなど">'+esc(f.health||'')+'</textarea>';
  h+='<label>ご質問・ご要望（任意）</label><textarea id="e_note" rows="2" placeholder="カウンセリングの希望日時など">'+esc(f.note||'')+'</textarea>';
  h+='</div>';
  h+='<h2>注意事項</h2><div class="card">';
  if(E.termsUrl){h+='<p style="margin:0">お申し込みの前に、<a href="'+esc(E.termsUrl)+'" target="_blank">利用規約・注意事項</a>をお読みください。</p>';}
  else{
    h+='<ul class="terms"><li>この時点では、ご契約とお支払いは確定しません。うーじさんからご連絡し、カウンセリングで内容を確認してから確定します。</li>';
    h+='<li>'+esc(E.payNote)+'</li><li>持病やケガのある方、通院中の方は、医師に相談のうえでお申し込みください。</li><li>食事の写真や体重などの記録は、サポートのためだけに使います。</li></ul>';
  }
  h+='<label class="chk"><input type="checkbox" id="e_agree"'+(f.agree?' checked':'')+'>注意事項を読み、同意します</label></div>';
  h+='<div style="margin-top:12px"><button class="pri" onclick="eConfirm()">確認画面へ進む</button></div><div id="e_msg"></div>';
  return h;
}
function eErr(m){var el=document.getElementById('e_msg');if(el)el.innerHTML='<p class="err">'+esc(m)+'</p>';}
function eConfirm(){
  collect();var f=ES.f,p=ePlan();
  if(!p)return eErr('プランを選んでください。');
  if(p.cont&&!f.cond)return eErr('継続プランの対象になるかどうかを選んでください。');
  if(!String(f.name||'').trim())return eErr('お名前を入れてください。');
  if(!String(f.tel||'').trim())return eErr('電話番号を入れてください。');
  if(String(f.email||'').indexOf('@')<0&&String(f.email||'').indexOf('＠')<0)return eErr('メールアドレスを正しく入れてください。');
  if(!f.agree)return eErr('注意事項への同意にチェックを入れてください。');
  ES.step='confirm';render();window.scrollTo(0,0);
}
function viewEnrollConfirm(){
  var f=ES.f,p=ePlan(),h='<p class="muted">この内容でお申し込みします。よろしければ「この内容で申し込む」を押してください。</p>';
  h+='<div class="card"><div class="kv">';
  h+='<div>プラン</div><div><b>'+esc(p.name)+'</b></div><div>料金（税込）</div><div>'+esc(p.priceLabel)+'</div>';
  if(p.desc)h+='<div>内容</div><div>'+esc(p.desc)+'</div>';
  if(p.cont)h+='<div>継続の条件</div><div>'+esc(condLabel(f.cond))+'</div>';
  h+='<div>お名前</div><div>'+esc(f.name)+'</div><div>電話番号</div><div>'+esc(f.tel)+'</div><div>メール</div><div>'+esc(f.email)+'</div>';

  if(f.note)h+='<div>ご質問</div><div class="pre">'+esc(f.note)+'</div>';

  h+='<div class="card ref" style="font-size:13px">'+esc(E.payNote)+'</div>';
  h+='<div style="margin-top:12px"><button class="pri" id="e_go" onclick="eSubmit(this)">この内容で申し込む</button></div>';

function eBack(){ES.step='form';render();window.scrollTo(0,0);}
function eSubmit(el){
  el.disabled=true;el.textContent='送信しています…';

  gas().withSuccessHandler(function(r){
    ES.step='done';ES.result=r;E=null;window.scrollTo(0,0);
    if(r.token)TOKEN=r.token;
    tab='申込み';START='申込み';load();
  }).withFailureHandler(function(e){el.disabled=false;el.textContent='この内容で申し込む';eErr(e.message||e);}).api_enroll(TOKEN,TICKET,payload);
}

function val(id, fallback){var el=document.getElementById(id);return el?el.value:(fallback||'');}

  var g=D.goal||{};

  h+='<div><label>目標体脂肪率（%）</label><input id="g_f" inputmode="decimal" value="'+esc(g.fat)+'" placeholder="任意"></div></div>';
  h+='<label>期限</label><input type="date" id="g_d" value="'+esc(g.deadline)+'">';
  h+='<label>なりたい姿・理由</label><textarea id="g_v" rows="3" placeholder="3ヶ月後、どんな自分になっていたいですか？ それはなぜですか？">'+esc(g.vision)+'</textarea>';
  h+='<label>3ヶ月後の目標</label><textarea id="g_3" rows="2">'+esc(g.goal3m)+'</textarea>';
  h+='<label>1ヶ月目の目標</label><textarea id="g_1" rows="2">'+esc(g.goal1m)+'</textarea>';
  h+='<label>生活で変えること</label><textarea id="g_h" rows="2" placeholder="食事・睡眠・運動など、自分でやれそうなこと">'+esc(g.habit)+'</textarea>';
  h+='<label>体の悩み・既往歴</label><textarea id="g_c" rows="2" placeholder="うーじさんに伝えておきたいことがあれば">'+esc(g.concern)+'</textarea>';

  h+='<div style="margin-top:12px"><button class="pri" id="g_go" onclick="saveGoal()">目標を保存する</button></div><div id="g_msg"></div></div>';
  return h;
}
function viewWeight(){
  var w=D.weights||{entries:[],trend:null};
  var h='<p class="muted">数字は上下します。見るのは、流れです。朝・トイレのあとがおすすめです。</p>';
  var tr=w.trend;
  if(tr){
    h+='<div class="trend">';
    h+='<div class="card"><div class="muted">開始</div><div class="big">'+tr.start+'</div><div class="muted">kg</div></div>';
    h+='<div class="card"><div class="muted">いま</div><div class="big">'+tr.latest+'</div><div class="muted">kg</div></div>';
    h+='<div class="card"><div class="muted">開始から</div><div class="big">'+(tr.change>0?'+':'')+tr.change+'</div><div class="muted">kg</div></div>';
    if(tr.toGoal!==''){
      var tg=tr.toGoal, label=tg>0?'目標まで あと':(tg<0?'目標を下回り':'目標どおり');
      var num=tg===0?'±0':(tg>0?tg:(-tg));
      h+='<div class="card"><div class="muted">'+label+'</div><div class="big">'+num+'</div><div class="muted">kg（目標 '+tr.goal+'kg）</div></div>';
    }
    h+='</div>';
  }
  h+='<div class="card"><h2 style="margin-top:0">今日の記録</h2>';
  h+='<div class="grid2"><div><label>日付</label><input type="date" id="w_d" value="'+esc(wDate||D.today)+'"></div>';
  h+='<div><label>体重（kg）</label><input id="w_w" inputmode="decimal" placeholder="例：61.4"></div></div>';
  h+='<label>体脂肪率（%、任意）</label><input id="w_f" inputmode="decimal" placeholder="測ったときだけ">';
  h+='<label>ひとこと（任意）</label><input id="w_n" placeholder="外食した、よく眠れた、など">';
  h+='<div style="margin-top:12px"><button class="pri" id="w_go" onclick="saveWeight()">記録する</button></div><div id="w_msg"></div></div>';
  h+='<h2>最近の記録</h2>';
  if(!w.entries.length)h+='<div class="card muted">まだ記録がありません。今日の体重から、始めてみましょう。</div>';
  else{
    h+='<div class="card hist">';
    w.entries.forEach(function(e){
      h+='<div class="row"><div><b>'+esc(fmtDate(e.date))+'</b>'+(e.note?'<div class="muted">'+esc(e.note)+'</div>':'')+'</div><div>'+e.weight+' kg'+(e.fat!==''?'<div class="muted">体脂肪 '+e.fat+'%</div>':'')+'</div></div>';
    });
    h+='</div>';
  }
  return h;
}
function fmtDate(s){var p=String(s||'').split('-');if(p.length!==3)return s;return Number(p[1])+'/'+Number(p[2]);}
function mLabel(ym){var p=String(ym||'').split('-');if(p.length!==2)return ym||'';return Number(p[1])+'月';}
function mLabelY(ym){var p=String(ym||'').split('-');if(p.length!==2)return ym||'';return p[0]+'年'+Number(p[1])+'月';}
function viewMonthly(){
  var m=D.monthly||{month:'',prev:'',current:null,last:null,history:[]};
  var c=m.current||{goal:'',action:'',reflect:'',updated:''};
  var h='<p class="muted">月に1回、立ち止まって書いてみましょう。うまくいかなかったことも、次の一歩のヒントになります。</p>';
  h+='<div class="card ref"><b>'+esc(mLabel(m.prev))+'のあなた</b>';
  if(m.last&&(m.last.goal||m.last.action)){
    if(m.last.goal)h+='<div class="muted pre">目標：'+esc(m.last.goal)+'</div>';
    if(m.last.action)h+='<div class="muted pre">行動目標：'+esc(m.last.action)+'</div>';
  }else{
    h+='<div class="muted">'+esc(mLabel(m.prev))+'の目標は、まだありません。今月から始めましょう。</div>';
  }
  h+='</div>';
  h+='<div class="card"><h2 style="margin-top:0">'+esc(mLabelY(m.month))+'の目標</h2>';
  h+='<label>今月の目標</label><textarea id="m_g" rows="2" placeholder="例：体重を1kg落とす、お腹まわりをすっきりさせる">'+esc(c.goal)+'</textarea>';
  h+='<label>そのためにやること（行動目標）</label><textarea id="m_a" rows="3" placeholder="例：平日の夜は炭水化物を半分にする、毎日8000歩あるく">'+esc(c.action)+'</textarea>';
  h+='<label>先月の振り返り（反省）</label><textarea id="m_r" rows="3" placeholder="できたこと・できなかったこと、その理由など">'+esc(c.reflect)+'</textarea>';
  if(c.updated)h+='<p class="muted">最終更新：'+esc(c.updated)+'</p>';
  h+='<div style="margin-top:12px"><button class="pri" id="m_go" onclick="saveMonthly()">今月の目標を保存する</button></div><div id="m_msg"></div></div>';
  var past=(m.history||[]).filter(function(x){return x.month!==m.month;});
  if(past.length){
    h+='<h2>これまでの振り返り</h2><div class="card hist">';
    past.slice(0,6).forEach(function(x){
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>'+esc(mLabelY(x.month))+'</b>';
      if(x.goal)h+='<div class="pre">目標：'+esc(x.goal)+'</div>';
      if(x.action)h+='<div class="muted pre">行動目標：'+esc(x.action)+'</div>';
      if(x.reflect)h+='<div class="muted pre">先月の反省：'+esc(x.reflect)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}
function saveMonthly(){
  var b=document.getElementById('m_go');b.disabled=true;b.textContent='保存しています…';
  var f={month:(D.monthly&&D.monthly.month)||'',goal:val('m_g'),action:val('m_a'),reflect:val('m_r')};
  gas().withSuccessHandler(function(r){D.monthly=r.monthly;alertMsg('今月の目標を保存しました。一緒にがんばりましょう！');render();window.scrollTo(0,0);})
  .withFailureHandler(function(e){b.disabled=false;b.textContent='今月の目標を保存する';document.getElementById('m_msg').innerHTML='<p class="err">'+esc(e.message)+'</p>';}).api_saveMonthly(TOKEN,f);
}
function saveGoal(){
  var b=document.getElementById('g_go');b.disabled=true;b.textContent='保存しています…';
  var f={weight:val('g_w'),fat:val('g_f'),deadline:val('g_d'),vision:val('g_v'),goal3m:val('g_3'),goal1m:val('g_1'),habit:val('g_h'),concern:val('g_c'),memo:val('g_m')};
  gas().withSuccessHandler(function(r){D.goal=r.goal;alertMsg('目標を保存しました。ありがとうございます。');render();window.scrollTo(0,0);})
  .withFailureHandler(function(e){b.disabled=false;b.textContent='目標を保存する';document.getElementById('g_msg').innerHTML='<p class="err">'+esc(e.message)+'</p>';}).api_saveGoal(TOKEN,f);
}
function saveWeight(){

  wDate=val('w_d',wDate);

  .withFailureHandler(function(e){b.disabled=false;b.textContent='記録する';document.getElementById('w_msg').innerHTML='<p class="err">'+esc(e.message)+'</p>';}).api_saveWeight(TOKEN,f);
}
function selDay(d){day=d;pick=null;render();}
function selT(ms){pick=D.slots.filter(function(s){return s.ms===ms;})[0];render();}
function book(){var b=document.getElementById('go');b.disabled=true;b.textContent='予約しています…';
  gas().withSuccessHandler(function(r){pick=null;alertMsg('ご予約ありがとうございます！'+r.when+' でお待ちしています。');load();})
  .withFailureHandler(function(e){b.disabled=false;b.textContent='この日時で予約する';document.getElementById('msg').innerHTML='<p class="err">'+esc(e.message)+'</p>';}).api_book(TOKEN,pick.ms);}
var armed=null;
function cancelB(id,el){
  if(armed!==id){armed=id;el.textContent='もう一度押すとキャンセル';el.style.borderColor='#b3261e';el.style.color='#b3261e';
    setTimeout(function(){if(armed===id){armed=null;render();}},5000);return;}
  armed=null;el.disabled=true;el.textContent='キャンセル中…';
  gas().withSuccessHandler(function(){alertMsg('キャンセルしました。');load();}).withFailureHandler(function(e){alertMsg(e.message,'err');load();}).api_cancel(TOKEN,id);}
function alertMsg(m,cls){document.getElementById('flash').innerHTML='<div class="card '+(cls||'ok')+'">'+esc(m)+'</div>';window.scrollTo(0,0);}
/* ---------- 公式LINEから開いたとき ---------- */
function getU(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('u'))return q.get('u');
    var state=q.get('liff.state')||'';
    if(!state)return '';
    var s=state;try{s=decodeURIComponent(state);}catch(e){}
    var i=s.indexOf('?');
    var q2=new URLSearchParams(i>=0?s.slice(i+1):s);
    return q2.get('u')||'';
  }catch(e){return '';}
}
function showUnlinked(formUrl){
  var f=/^https:\/\//.test(String(formUrl||''))?formUrl:FORM_URL_DEFAULT;
  document.getElementById('flash').innerHTML='';
  document.getElementById('app').innerHTML='<div style="text-align:center;padding:12px 4px">'
    +'<p>まだ、このLINEとお客様情報の連携ができていません。</p>'
    +'<p>うーじさんから公式LINEで届いた専用リンクを、このLINEの中で1回開いてください。それ以降は、トーク画面の「予約・体重」から使えるようになります。</p>'
    +'<p style="margin-top:28px">まだ入会前の方は、こちらからお申し込みください。</p>'
    +'<p><a href="'+esc(f)+'" target="_blank" style="display:inline-block;background:#0b0a08;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700">入会の申し込みへ</a></p>'
    +'</div>';
}
function startLine(){
  if(!window.liff){fail({message:OPEN_ERR});return;}
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    var idt=liff.getIDToken();
    if(!idt){fail({message:'LINEの確認ができませんでした。許可の画面で同意してから、もう一度開いてください。'});return;}
    var u=getU();
    call('line',{id_token:idt,u:u}).then(function(r){
      if(u&&window.history&&history.replaceState){try{history.replaceState(null,'',location.pathname);}catch(e){}}
      r=r||{};
      if(r.status==='ok'){TOKEN=r.token||'';NOTICE=r.notice||'';START=r.start||'';onMe(r.me);return;}
      if(r.status==='enroll'){TOKEN='';TICKET=r.ticket||'';START=r.start||'申込み';load();return;}
      showUnlinked(r.formUrl);
    },fail);
  }).catch(function(){fail({message:OPEN_ERR});});
}
startLine();
