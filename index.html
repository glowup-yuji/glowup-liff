<!doctype html><html lang="ja"><head><meta charset="utf-8">

<title>GLOW UP. ご予約</title>

<style>
:root{--gold:#b08d2e;--ink:#1d1b18;--muted:#6b655b;--line:#e6dfd0;--bg:#faf8f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
header{background:#0b0a08;color:#d4af37;text-align:center;padding:14px;font-family:Georgia,serif;letter-spacing:.2em;font-size:20px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}h2{font-size:15px;margin:22px 0 8px;color:var(--gold);letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:28px;font-weight:700}.muted{color:var(--muted);font-size:13px}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.pri{background:#0b0a08;color:#fff;width:100%;padding:14px;font-weight:700}.ghost{background:#fff;border:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.days button{flex:none;background:#fff;border:1px solid var(--line)}
.days button.on,.times button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.times button{background:#fff;border:1px solid var(--line);padding:10px 0}
.confirm{margin-top:12px}.err{color:#b3261e}.ok{color:#1f7a3f}
.note{font-size:12.5px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
.tabs{display:flex;gap:6px;margin:0 0 16px}
.tabs button{flex:1;background:#fff;border:1px solid var(--line);padding:10px 6px;font-weight:600;font-size:14px}

label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.hist{font-size:13.5px}

.tabs button{white-space:nowrap;font-size:13px;padding:10px 4px}

.pre{white-space:pre-wrap}
.plan{cursor:pointer;position:relative}.plan.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:#fffdf6}

.kv{display:grid;grid-template-columns:7em 1fr;gap:6px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.req{color:#b3261e;font-size:11px;margin-left:4px}
.terms{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.linkbtn{display:block;text-align:center;text-decoration:none;border-radius:10px;margin-top:10px}
.tabs.main button{font-size:15px;padding:12px 6px}

.subtabs button{background:#fff;border:1px solid var(--line);padding:11px 4px;font-weight:600;font-size:13px;white-space:nowrap}
.subtabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f6eedb;color:#7a5f17;margin-right:4px;vertical-align:1px}
.tag.zoom{background:#0b0a08;color:#d4af37}
.zero{background:#f6f1e4;border-radius:10px;padding:12px;font-weight:700;text-align:center}
.zbox{background:#fffdf6;border:1px solid #eadcb6;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#fff;border:1px solid var(--line);padding:12px 4px;font-weight:600;min-height:46px}
.seg button.on{background:#0b0a08;color:#fff;border-color:#0b0a08}
.seg button.on.no{background:#6b655b;border-color:#6b655b}
.kindseg{margin-bottom:12px}.kindseg button.on{background:var(--gold);border-color:var(--gold)}
.meal{padding:10px 0;border-bottom:1px solid var(--line)}.meal:last-of-type{border-bottom:0}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
.meal input[type=time]{margin-top:8px;font-size:17px;min-height:46px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stats .card{margin:0;text-align:center;padding:12px 6px}.stats .big{font-size:24px}
.wk{font-size:13.5px}.wk .row{padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}.wk .row:last-child{border-bottom:0}
.wk .today{background:#fffdf6}
.fast{font-weight:700;white-space:nowrap}.fast.good{color:#1f7a3f}
.chart{width:100%;height:auto;display:block;margin:4px 0 8px}
.home .card h2{margin-top:0}
.sch textarea{min-height:46px}
.sch .row{align-items:flex-start}
.go2{margin-top:10px}
.tsel{display:flex;gap:6px;margin-top:6px}.tsel select{flex:1;font-size:17px;min-height:46px;padding:8px}
.tlabel{font-size:13px;font-weight:600;margin-top:8px}
.snack{display:flex;gap:6px;align-items:center;margin-top:6px}.snack .tsel{flex:1;margin-top:0}.snack .sn{width:3.6em;font-size:13px;color:var(--muted)}
.snack .del{width:4em;flex:none;padding:10px 6px}
.pl{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.pl:last-of-type{border-bottom:0}
.pl .pk{width:1.6em;font-weight:700;padding-top:12px}
.seg.where{margin-top:6px}.seg.where button{min-height:42px;padding:9px 4px}.seg.where button.on{background:var(--gold);border-color:var(--gold)}
.todaycard{border-color:var(--gold)}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:8px 0 10px}
.wcard{border-color:var(--gold)}.wcard h2{margin-top:0}
.bigin{font-size:26px;font-weight:700;text-align:center;min-height:58px}
.wnow .big{font-size:32px}.done{color:#1f7a3f;font-weight:700}
</style></head><body><header>GLOW UP.</header><div id="flash" style="max-width:560px;margin:0 auto;padding:12px 16px 0"></div><main id="app"><p class="muted">読み込み中…</p></main>
<script>
/* GLOW UP. マイページ（公式LINE / LIFF）  ※予約システム v9 と組み合わせて使います
   LINEで本人確認 → 予約システム（Google Apps Script）の JSON API を fetch で呼びます。
   この画面から script.google.com へ移動することはありません。管理キーはここにはありません。 */
var LIFF_ID = '2012605802-7XWt8wqw';
var API_URL = 'https://script.google.com/macros/s/AKfycbytwXgcklFUqBaWNb2P67plc8RXNIUmHkgx6Ckzao75rlsbQpm8i9BlVioV43IEg3lM/exec';
var FORM_URL_DEFAULT = 'https://docs.google.com/forms/d/e/1FAIpQLSdlOM8HhH2OuScbH5d3edMAzbWaB23CGSuBUIRZS7gtHfuXWQ/viewform';
var OPEN_ERR = '画面を開けませんでした。時間をおいて、もう一度「予約・体重」から開いてください。';
var NET_ERR = '通信がうまくいきませんでした。電波のよいところで、もう一度お試しください。';
var TOKEN = '';
var NOTICE = '';
var TICKET = '';
var START = '';
function call(action, params){
  var body = {action: action};
  if (params) for (var k in params) if (Object.prototype.hasOwnProperty.call(params, k)) body[k] = params[k];
  return fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit', cache: 'no-store'})
    .then(function(res){ if (!res.ok) throw new Error(NET_ERR); return res.text(); }, function(){ throw new Error(NET_ERR); })
    .then(function(t){ var r; try { r = JSON.parse(t); } catch (e) { throw new Error(NET_ERR); } if (!r || !r.ok) throw new Error((r && r.error) || NET_ERR); return r.data; });
}
/* 以前の gas() と同じ書き方で、サーバーを呼べるようにする小さな仕組み */
var API_ARGS = {
  api_me: ['me', ['token']],
  api_book: ['book', ['token', 'ms', 'kind']],
  api_saveMeal: ['saveMeal', ['token', 'f']],
  api_saveSchedule: ['saveSchedule', ['token', 'f']],
  api_cancel: ['cancel', ['token', 'bookingId']],
  api_saveGoal: ['saveGoal', ['token', 'f']],
  api_saveWeight: ['saveWeight', ['token', 'f']],
  api_getMonthly: ['getMonthly', ['token']],
  api_saveMonthly: ['saveMonthly', ['token', 'f']],
  api_enrollInfo: ['enrollInfo', ['token', 'ticket']],
  api_enroll: ['enroll', ['token', 'ticket', 'f']]
};
function gas(){
  var ok = function(){}, ng = function(){};
  var r = {
    withSuccessHandler: function(f){ ok = f; return r; },
    withFailureHandler: function(f){ ng = f; return r; }
  };
  Object.keys(API_ARGS).forEach(function(name){
    r[name] = function(){
      var spec = API_ARGS[name], p = {};
      for (var i = 0; i < spec[1].length; i++) p[spec[1][i]] = arguments[i];
      call(spec[0], p).then(function(d){ ok(d); }, function(e){ ng(e); });
    };
  });
  return r;
}
var E = null, ES = {step:'form', f:{}}, eLoading = false;
var D = null, day = null, pick = null, tab = '予約', wDate = null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function onMe(d){D=d;if(!wDate)wDate=d.today;if(START){tab=START;START='';}if(NOTICE){document.getElementById('flash').innerHTML='<div class="card ok" style="margin:0">'+esc(NOTICE)+'</div>';NOTICE='';}render();}
function load(){if(!TOKEN){tab='申込み';render();return;}gas().withSuccessHandler(onMe).withFailureHandler(fail).api_me(TOKEN);}
function fail(e){document.getElementById('app').innerHTML='<div class="card err">'+esc(e.message||e)+'</div>';}
function go(t){tab=t;render();}
function tabs(){
  var my=isMy(tab);
  var h='<div class="tabs main"><button class="'+(tab==='予約'?'on':'')+'" onclick="go(\'予約\')">予約</button><button class="'+(my?'on':'')+'" onclick="go(\'きょう\')">マイページ</button></div>';
  if(my){h+='<div class="subtabs">';MY_TABS.forEach(function(it){h+='<button class="'+(tab===it[0]?'on':'')+'" onclick="go(\''+it[0]+'\')">'+it[1]+'</button>';});h+='</div>';}
  return h;
}
function render(){
  if(!TOKEN){document.getElementById('app').innerHTML='<h1>入会のお申し込み</h1>'+viewEnroll();return;}
  var h='<h1>'+esc(D.name)+' 様</h1>'+tabs();
  if(tab==='申込み') h+='<p><button class="ghost" onclick="backHome()">← マイページにもどる</button></p>'+viewEnroll();
  else if(tab==='目標') h+=viewGoal();
  else if(tab==='体重') h+=viewWeight();
  else if(tab==='今月') h+=viewMonthly();
  else if(tab==='きょう') h+=viewHome();
  else if(tab==='食事') h+=viewMeal();
  else if(tab==='予定') h+=viewSchedule();
  else h+=viewBook();
  document.getElementById('app').innerHTML=h;
}
function viewBook(){
  var h='<h2>ご契約中のプラン</h2>';
  if(!D.contracts.length) h+='<div class="card muted">ご契約中のプランはありません。</div>';
  D.contracts.forEach(function(k){
    if(k.paid==='申込み中'){h+='<div class="card ref"><div class="row"><b>'+esc(k.plan)+'</b><span class="muted">お申し込み受付中</span></div><div class="muted">うーじさんから公式LINEでご連絡します。開始日はそのときに決めます。</div></div>';return;}
    h+='<div class="card"><div class="row"><b>'+esc(k.plan)+'</b></div><div class="muted">'+esc(k.period)+'</div>';
    if(k.zoom){var zz=D.zoom||{};h+='<div style="margin-top:6px"><span class="tag zoom">Zoom面談</span>'+(zz.eligible?'あと <b>'+zz.left+'</b> 回（月'+k.zoom+'回・くり越しOK・全'+zz.total+'回）':'月'+k.zoom+'回つき')+'</div>';}
    if(k.total){var p=Math.round(k.used/k.total*100);h+='<div class="row" style="margin-top:6px"><span>残り</span><span><span class="big">'+k.left+'</span> 回 / 全'+k.total+'回</span></div><div class="bar"><i style="width:'+p+'%"></i></div>';}
    h+='</div>';
  });
  h+='<h2>ご予約</h2>';
  if(!D.upcoming.length) h+='<div class="card muted">今のご予約はありません。</div>';
  D.upcoming.forEach(function(b){
    h+='<div class="card row"><div>'+(b.kind==='Zoom面談'?'<span class="tag zoom">Zoom面談</span><br>':'')+'<b>'+esc(b.label)+'</b><div class="muted">'+esc(b.plan)+'</div></div>'+(b.cancelable?'<button class="ghost" onclick="cancelB(\''+b.id+'\',this)">キャンセル</button>':'<span class="muted">前日を過ぎています</span>')+'</div>';
  });
  h+='<h2>予約する</h2><div class="card">';
  var z=D.zoom||{eligible:false},kinds=[];
  if(D.canBook)kinds.push('パーソナル');
  if(z.eligible)kinds.push('Zoom面談');
  if(!bkind||kinds.indexOf(bkind)<0)bkind=kinds[0]||'';
  if(kinds.length>1){h+='<div class="seg kindseg">';kinds.forEach(function(k){h+='<button class="'+(bkind===k?'on':'')+'" onclick="selKind(\''+k+'\')">'+(k==='Zoom面談'?'Zoom面談':'パーソナル')+'</button>';});h+='</div>';}
  var SL=bkind==='Zoom面談'?(z.slots||[]):D.slots, LEN=bkind==='Zoom面談'?z.len:D.len;
  if(bkind==='Zoom面談'){h+='<div class="zbox"><span class="tag zoom">Zoom面談</span>'+zoomLine(z)+'<div class="muted">1回'+z.len+'分・オンライン'+(z.next?'　次回：'+esc(z.next):'')+'</div><div class="muted">'+esc(z.note)+'</div></div>';}
  if(D.pendingApply&&!kinds.length){
    h+='<p>お申し込みを受け付けました。内容を確認して、こちらから受付確定のご連絡をします。確定までもうしばらくお待ちください。</p><p class="muted" style="margin:0">そのあいだに、「目標」や「今日の体重」タブを使っておくこともできます。</p>';
  }else if(!kinds.length){
    h+='<p>こちらのプランは、食事サポートが中心です。この画面からのご予約はありません。</p><p class="muted" style="margin:0">対面でお会いしたいときは、公式LINEでご相談ください。</p>';
  }else if(!SL.length){
    h+=bkind==='Zoom面談'?(!z.left?'<div class="zero">いまは、Zoom面談の残りが 0回 です。'+(z.rest?'来月になると、また1回ふえます。':'')+'</div>':'<div class="muted">今予約できるZoom面談の枠がありません。ご希望の日時がないときは、公式LINEでご相談ください。</div>'):'<div class="muted">今予約できる枠がありません。残り回数がない場合や、ご希望の日時がない場合は、公式LINEでご相談ください。</div>';
  }else{
    var days=[];SL.forEach(function(s){if(days.indexOf(s.day)<0)days.push(s.day);});
    if(!day||days.indexOf(day)<0)day=days[0];
    h+='<div class="muted" style="margin-bottom:6px">日にちを選んでください</div><div class="days">';
    days.forEach(function(d){h+='<button class="'+(d===day?'on':'')+'" onclick="selDay(\''+d+'\')">'+esc(d)+'</button>';});
    h+='</div><div class="times">';
    SL.filter(function(s){return s.day===day;}).forEach(function(s){h+='<button class="'+(pick&&pick.ms===s.ms?'on':'')+'" onclick="selT('+s.ms+')">'+s.time+'</button>';});
    h+='</div>';
    if(pick){h+='<div class="confirm"><p><b>'+esc(pick.day)+' '+pick.time+'</b>（'+LEN+'分）'+(bkind==='Zoom面談'?'の<b>Zoom面談</b>':'')+'で予約しますか？</p><button class="pri" id="go" onclick="book()">この日時で予約する</button></div>';}
    h+='<div id="msg"></div>';
  }
  h+='</div>';
  if(D.past.length){h+='<h2>これまで</h2>';D.past.forEach(function(b){h+='<div class="card row"><span>'+esc(b.label)+'</span><span class="muted">'+esc(b.state==='予約済'?'完了':b.state)+'</span></div>';});}
  h+='<h2>プランのお申し込み</h2><div class="card"><p class="muted" style="margin-top:0">継続プランへの切り替えや、新しいプランのお申し込みはこちらから。</p><button class="ghost" style="width:100%" onclick="openApply()">プランを申し込む</button></div>';
  if(D.canBook){h+='<div class="note">場所：'+esc(D.place)+'<br>キャンセルは前日までこの画面からできます。当日のキャンセルは1回分の消化になります。<br>日時を変えたいときは、キャンセルしてから取り直してください。</div>';}
  else{h+='<div class="note">場所：'+esc(D.place)+'</div>';}
  return h;
}
/* ---------- 入会・プランのお申し込み ---------- */
var COND = [['program','GLOW UP.の3ヶ月プログラムを修了した'],['pitin','PIT INのサイクルファスティングを3ヶ月受けた'],['none','どちらでもない・相談したい']];
function openApply(){ES={step:'form',f:{}};E=null;tab='申込み';render();window.scrollTo(0,0);}
function backHome(){ES={step:'form',f:{}};E=null;go('予約');window.scrollTo(0,0);}
function toGoal(){ES={step:'form',f:{}};go('目標');window.scrollTo(0,0);}
function loadEnroll(){
  if(eLoading)return;eLoading=true;
  gas().withSuccessHandler(function(r){eLoading=false;E=r;var f=ES.f;if(!f._init){f._init=1;f.name=f.name||r.me.name;f.tel=f.tel||r.me.tel;f.email=f.email||r.me.email;}render();})
  .withFailureHandler(function(e){eLoading=false;fail(e);}).api_enrollInfo(TOKEN,TICKET);
}
function ePlan(){if(!E)return null;return E.plans.filter(function(p){return p.id===ES.f.plan;})[0]||null;}
function condLabel(k){var x=COND.filter(function(c){return c[0]===k;})[0];return x?x[1]:'';}
function kindLabel(k){return k==='オンライン'?'オンライン食事サポート':(k==='パーソナル'?'パーソナルトレーニング（食事サポート付き）':(k==='会員'?'卒業生の方':(k||'その他')));}
function eget(id){var el=document.getElementById(id);return el?el.value:null;}
function collect(){
  var f=ES.f;
  [['e_name','name'],['e_tel','tel'],['e_mail','email'],['e_goal','goal'],['e_health','health'],['e_note','note']].forEach(function(p){var v=eget(p[0]);if(v!==null)f[p[1]]=v;});
  var ag=document.getElementById('e_agree');if(ag)f.agree=ag.checked;
  var cs=document.querySelectorAll('input[name=e_cond]');for(var i=0;i<cs.length;i++){if(cs[i].checked)f.cond=cs[i].value;}
}
function selPlan(el){collect();ES.f.plan=el.getAttribute('data-id');render();}
function selCond(el){collect();}
function viewEnroll(){
  if(ES.step==='done')return viewEnrollDone();
  if(!E){loadEnroll();return '<p class="muted">読み込み中…</p>';}
  if(!E.open)return '<div class="card">現在、こちらからのお申し込みは受け付けていません。公式LINEでご相談ください。</div>';
  if(ES.step==='confirm')return viewEnrollConfirm();
  var f=ES.f, sel=ePlan(), h='';
  h+='<p class="muted">ご希望のプランを選んで、お名前と連絡先を入れてください。この画面でお支払いが発生することはありません。</p>';

function lineChart(pts,key,unit,label){
  pts=(pts||[]).filter(function(e){return e[key]!==''&&e[key]!=null&&isFinite(Number(e[key]));}).slice().sort(function(a,b){return String(a.date)<String(b.date)?-1:1;});
  if(pts.length<2)return '';
  var vs=pts.map(function(e){return Number(e[key]);}),min=Math.min.apply(null,vs),max=Math.max.apply(null,vs);
  if(min===max){min-=1;max+=1;}
  var W=320,H=120,p=14,L=38;
  function sx(i){return L+i*(W-L-p)/(pts.length-1);}
  function sy(v){return p+(max-v)/(max-min)*(H-p*2);}
  var d=pts.map(function(e,i){return (i?'L':'M')+sx(i).toFixed(1)+','+sy(Number(e[key])).toFixed(1);}).join(' ');
  var h='<div class="muted">'+label+'</div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">';
  h+='<line x1="'+L+'" y1="'+(H-p)+'" x2="'+(W-p)+'" y2="'+(H-p)+'" stroke="#e6dfd0"/>';
  h+='<text x="2" y="'+(p+4)+'" font-size="10" fill="#6b655b">'+max+unit+'</text><text x="2" y="'+(H-p+3)+'" font-size="10" fill="#6b655b">'+min+unit+'</text>';
  h+='<text x="'+L+'" y="'+(H-1)+'" font-size="10" fill="#6b655b">'+esc(fmtDate(pts[0].date))+'</text><text x="'+(W-p)+'" y="'+(H-1)+'" font-size="10" fill="#6b655b" text-anchor="end">'+esc(fmtDate(pts[pts.length-1].date))+'</text>';
  h+='<path d="'+d+'" fill="none" stroke="#b08d2e" stroke-width="2"/>';
  pts.forEach(function(e,i){h+='<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(Number(e[key])).toFixed(1)+'" r="3" fill="#b08d2e"/>';});
  return h+'</svg>';
}

  .withFailureHandler(function(e){b.disabled=false;b.textContent='きょうの体重を記録する';document.getElementById('hw_msg').innerHTML='<p class="err">'+esc(e.message)+'</p>';}).api_saveWeight(TOKEN,f);

function alertMsg(m,cls){document.getElementById('flash').innerHTML='<div class="card '+(cls||'ok')+'">'+esc(m)+'</div>';window.scrollTo(0,0);}
/* ---------- 公式LINEから開いたとき ---------- */
function getParam(name){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get(name))return q.get(name);
    var state=q.get('liff.state')||'';
    if(!state)return '';
    var s=state;try{s=decodeURIComponent(state);}catch(e){}
    var i=s.indexOf('?');
    var q2=new URLSearchParams(i>=0?s.slice(i+1):s);
    return q2.get(name)||'';
  }catch(e){return '';}
}
function getU(){return getParam('u');}
function showUnlinked(formUrl){
  var f=/^https:\/\//.test(String(formUrl||''))?formUrl:FORM_URL_DEFAULT;
  document.getElementById('flash').innerHTML='';
  document.getElementById('app').innerHTML='<div style="text-align:center;padding:12px 4px">'
    +'<p>まだ、このLINEとお客様情報の連携ができていません。</p>'
    +'<p>うーじさんから公式LINEで届いた専用リンクを、このLINEの中で1回開いてください。それ以降は、トーク画面の「予約・体重」から使えるようになります。</p>'
    +'<p style="margin-top:28px">まだ入会前の方は、こちらからお申し込みください。</p>'
    +'<p><a href="'+esc(f)+'" target="_blank" style="display:inline-block;background:#0b0a08;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700">入会の申し込みへ</a></p>'
    +'</div>';
}
function startLine(){
  if(!window.liff){fail({message:OPEN_ERR});return;}
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    var idt=liff.getIDToken();
    if(!idt){fail({message:'LINEの確認ができませんでした。許可の画面で同意してから、もう一度開いてください。'});return;}
    var u=getU(), tb=getParam('tab');
    call('line',{id_token:idt,u:u,tab:tb}).then(function(r){
      if((u||tb)&&window.history&&history.replaceState){try{history.replaceState(null,'',location.pathname);}catch(e){}}
      r=r||{};
      if(r.status==='ok'){TOKEN=r.token||'';NOTICE=r.notice||'';START=r.start||'';onMe(r.me);return;}
      if(r.status==='enroll'){TOKEN='';TICKET=r.ticket||'';START=r.start||'申込み';load();return;}
      showUnlinked(r.formUrl);
    },fail);
  }).catch(function(){fail({message:OPEN_ERR});});
}
startLine();
</script></body></html>
